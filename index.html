    <style>
        :root {
            --primary: #6366f1;
            --primary-hover: #4f46e5;
            --success: #22c55e;
            --danger: #ef4444;
            --bg: #f8fafc;
            --card-bg: #ffffff;
            --text: #0f172a;
            --text-light: #64748b;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Roboto, Helvetica, sans-serif; }
        body { background-color: var(--bg); color: var(--text); display: flex; flex-direction: column; align-items: center; min-height: 100vh; padding: 12px; }
        
        .quiz-card { max-width: 480px; width: 100%; background: var(--card-bg); border-radius: 20px; box-shadow: 0 10px 25px rgba(0,0,0,0.05); padding: 20px; border: 1px solid #e2e8f0; margin-bottom: 15px; }
        
        .badge { background: #e0e7ff; color: var(--primary); display: inline-block; padding: 4px 12px; border-radius: 20px; font-size: 0.75rem; font-weight: 700; text-transform: uppercase; margin-bottom: 10px; letter-spacing: 0.5px; }
        h1 { font-size: 1.4rem; font-weight: 800; color: #1e293b; line-height: 1.3; margin-bottom: 15px; }
        
        .ad-container { background: #f1f5f9; border: 2px dashed #cbd5e1; text-align: center; padding: 12px; font-size: 0.7rem; font-weight: bold; color: #94a3b8; text-transform: uppercase; border-radius: 12px; margin: 15px 0; min-height: 60px; display: flex; justify-content: center; align-items: center; }
        
        .progress-bar { width: 100%; height: 6px; background: #e2e8f0; border-radius: 10px; overflow: hidden; margin-bottom: 20px; }
        .progress-fill { width: 33%; height: 100%; background: var(--primary); transition: width 0.3s ease; }
        
        .question-text { font-size: 1.15rem; font-weight: 700; margin-bottom: 20px; line-height: 1.45; color: #1e293b; }
        .options-grid { display: flex; flex-direction: column; gap: 12px; }
        
        .option-card { width: 100%; background: var(--card-bg); border: 2px solid #e2e8f0; padding: 14px 18px; text-align: left; font-size: 1rem; font-weight: 600; border-radius: 14px; cursor: pointer; transition: all 0.2s ease; display: flex; align-items: center; justify-content: space-between; color: #334155; }
        .option-card:hover { border-color: var(--primary); background: #f8fafc; transform: translateY(-1px); }
        
        .option-card.correct { border-color: var(--success) !important; background: #f0fdf4 !important; color: #166534 !important; }
        .option-card.incorrect { border-color: var(--danger) !important; background: #fef2f2 !important; color: #991b1b !important; }
        
        .feedback-box { margin-top: 15px; padding: 15px; border-radius: 12px; font-size: 0.95rem; line-height: 1.5; display: none; font-weight: 500; animation: fadeIn 0.3s ease; }
        .feedback-box.correct { background: #dcfce7; color: #14532d; border-left: 5px solid var(--success); }
        .feedback-box.incorrect { background: #fee2e2; color: #7f1d1d; border-left: 5px solid var(--danger); }
        
        .next-btn { display: none; width: 100%; background: linear-gradient(135deg, var(--primary), #4f46e5); color: white; border: none; padding: 15px; text-align: center; font-size: 1.1rem; font-weight: 700; border-radius: 14px; cursor: pointer; margin-top: 20px; box-shadow: 0 4px 12px rgba(99, 102, 241, 0.3); animation: pulse 2s infinite; }
        .next-btn:hover { background: var(--primary-hover); transform: translateY(-1px); }

        @keyframes fadeIn { from { opacity: 0; transform: translateY(5px); } to { opacity: 1; transform: translateY(0); } }
        @keyframes pulse { 0% { box-shadow: 0 0 0 0 rgba(99, 102, 241, 0.4); } 70% { box-shadow: 0 0 0 10px rgba(99, 102, 241, 0); } 100% { box-shadow: 0 0 0 0 rgba(99, 102, 241, 0); } }
    </style>
</head>
<body>

    <div class="quiz-card">
        <div style="text-align: center;">
            <span class="badge">🔥 Live IQ Test</span>
            <h1>Superhuman Intelligence Quiz</h1>
        </div>

        <!-- ✅ DEPLOYED LOCATION 2: ADSTERRA NATIVE BANNER (TOP) -->
        <div class="ad-container">
            <script async="async" data-cfasync="false" src="https://bancadeltempoidea.org"></script>
            <div id="container-44589311e40896d657b6fd44370f5f19"></div>
        </div>

        <div class="progress-bar">
            <div class="progress-fill" id="bar-fill"></div>
        </div>

        <div id="quiz-content">
            <div class="question-text" id="question-label">Question 1: Which number cleanly completes the logical pattern: 2, 6, 12, 20, 30, ...?</div>
            
            <div class="options-grid" id="options-box">
                <button class="option-card" onclick="submitChoice(this, false, 'Incorrect. Look closer at the sequence steps: the amount added increases cleanly by 2 every step (+4, +6, +8, +10). The next required step adds +12.')">40</button>
                <button class="option-card" onclick="submitChoice(this, true, 'Brilliant! You calculated correctly. The additions scale step-by-step: +4, +6, +8, +10. Adding 12 to 30 brings the answer to exactly 42.')">42</button>
                <button class="option-card" onclick="submitChoice(this, false, 'Incorrect. Re-evaluate the steady progressive growth rate between each step in the sequence.')">44</button>
            </div>
        </div>

        <!-- ✅ DEPLOYED LOCATION 3: ADSTERRA NATIVE AD GRID (MIDDLE) -->
        <div class="ad-container">
            <script async="async" data-cfasync="false" src="https://bancadeltempoidea.org"></script>
            <div id="container-44589311e40896d657b6fd44370f5f19"></div>
        </div>

        <div class="feedback-box" id="feedback-display"></div>

        <button class="next-btn" id="continue-btn" onclick="moveToNext()">CONTINUE CHALLENGE 👉</button>
    </div>

    <script>
        let currentStep = 1;

        function submitChoice(element, isCorrect, explanationText) {
            const cards = document.querySelectorAll('.option-card');
            cards.forEach(card => card.disabled = true);

            if (isCorrect) {
                element.classList.add('correct');
                document.getElementById('feedback-display').className = "feedback-box correct";
            } else {
                element.classList.add('incorrect');
                document.getElementById('feedback-display').className = "feedback-box incorrect";
            }

            document.getElementById('feedback-display').innerText = explanationText;
            document.getElementById('feedback-display').style.display = "block";
            document.getElementById('continue-btn').style.display = "block";
        }

        function moveToNext() {
            currentStep++;
            
            if (currentStep === 2) {
                document.getElementById('bar-fill').style.width = "66%";
                document.getElementById('question-label').innerText = "Question 2: If a physician issues 3 pills and orders you to take one every 30 minutes, what is the life span of the prescription?";
                
                document.getElementById('options-box').innerHTML = `
                    <button class="option-card" onclick="submitChoice(this, false, 'Incorrect. Review when the clock begins running for pill number one.')">1.5 Hours</button>
                    <button class="option-card" onclick="submitChoice(this, true, 'Phenomenal! You take Pill #1 instantly (0 min), Pill #2 at 30 min, and Pill #3 at 60 min. Total duration is exactly 1 hour.')">1 Hour</button>
                    <button class="option-card" onclick="submitChoice(this, false, 'Incorrect. Calculate carefully starting exactly at structural minute zero.')">30 Minutes</button>
                `;
                
                document.getElementById('feedback-display').style.display = "none";
                document.getElementById('continue-btn').style.display = "none";
            } else {
                document.getElementById('bar-fill').style.width = "100%";
                document.getElementById('quiz-content').innerHTML = `
                    <div style="text-align:center; padding:10px 0;">
                        <span style="font-size: 3rem;">🏆</span>
                        <h2 style="margin: 10px 0; color:var(--success);">Evaluation Finalized!</h2>
                        <p style="font-weight:600; color:var(--text-light); line-height:1.5;">Your calculated IQ score is 135 (Top 2% Globally - Genius Level). Highly advanced pattern recognition skills detected!</p>
                    </div>
                `;
                document.getElementById('feedback-display').style.display = "none";
                document.getElementById('continue-btn').style.display = "none";
            }
        }
    </script>
</body>
